name: Build Geode Mod

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      # Đã xóa tham số 'version: nightly' bị lỗi ở đây
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload Artifact
        if: ${{ steps.build.outputs.build-output-path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.build-output-name || 'geode-mod-build' }}
          path: ${{ steps.build.outputs.build-output-path }}
