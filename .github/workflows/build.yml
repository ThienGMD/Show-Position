name: Build Geode Mod

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        id: geode-build
        with:
          combine: false
          target: ${{ matrix.config.target }}

      # SỬA TẠI ĐÂY: Lưu file build vào thư mục đích mang tên nền tảng để tránh bị ghi đè trùng lặp
      - name: Upload intermediate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ matrix.config.target }}
          path: |
            build*/**/*.geode
            out/**/*.geode
            **/*.geode

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      # SỬA TẠI ĐÂY: Tắt merge-multiple để giữ nguyên cấu trúc thư mục chứa cả 2 file Android32 và Android64
      - uses: actions/download-artifact@v4
        with:
          path: build-artifacts
          pattern: build-output-*

      # Đóng gói tự động quét sâu vào các thư mục con
      - name: Combine builds into single file
        uses: geode-sdk/build-geode-mod/combine@main
        id: build
        with:
          path: build-artifacts

      - name: Upload Final Mod
        uses: actions/upload-artifact@v4
        with:
          name: Show-Position-Mod
          path: |
            build-artifacts/**/*.geode
            build*/**/*.geode
            **/*.geode
