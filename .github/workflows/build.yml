name: Build Geode Mod

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          # SỬA LỖI CHÍNH: Tắt tự gộp tại đây để tránh xung đột cấu trúc build Android lẻ
          combine: false
          target: ${{ matrix.config.target }}

      # ĐỒNG BỘ: Đẩy tệp .mod thô lên server GitHub đúng với vị trí lưu trữ của Geode SDK
      - name: Upload uncombined build
        uses: actions/upload-artifact@v4
        with:
          name: geode-build-${{ matrix.config.target }}
          path: |-
            ${{ env.GEODE_TRADE_DIR }}
            build/**/*.mod
          if-no-files-found: error

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      # ĐỒNG BỘ: Tải toàn bộ mã thô từ các job build độc lập về chung một chỗ
      - name: Download all uncombined builds
        uses: actions/download-artifact@v4
        with:
          pattern: geode-build-*
          merge-multiple: true

      # ĐÓNG GÓI: Gộp các nền tảng Android lại thành một tệp duy nhất
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      # ĐẦU RA: Xuất bản gói cài đặt hoàn chỉnh cho người dùng tải xuống
      - uses: actions/upload-artifact@v4
        with:
          name: Show-Position-Builds
          path: ${{ steps.build.outputs.build-output-path }}
