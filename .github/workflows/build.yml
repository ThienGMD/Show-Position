name: Build Geode Mod

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
        with:
          version: nightly

      - uses: actions/upload-artifact@v4
        with:
          # SỬA TẠI ĐÂY: Đặt tên cố định cho file tải về (bạn có thể đổi thành tên mod của bạn)
          name: geode-mod-builds
          # SỬA TẠI ĐÂY: Quét và gom tất cả các file có đuôi .geode được tạo ra trong thư mục
          path: ./**/*.geode
