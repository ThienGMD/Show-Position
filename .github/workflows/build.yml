name: Build Geode Mod

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: false
          target: ${{ matrix.config.target }}

      - name: Upload uncombined build
        uses: actions/upload-artifact@v4
        with:
          name: geode-build-${{ matrix.config.target }}
          path: |
            build/**/*.mod
            build/**/*.geode
          if-no-files-found: error

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      # SỬA LỖI TẠI ĐÂY: Ép buộc tải toàn bộ file từ Job trước về thẳng thư mục build
      - name: Download all uncombined builds
        uses: actions/download-artifact@v4
        with:
          pattern: geode-build-*
          path: build
          merge-multiple: true

      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Show-Position-Builds
          path: ./**/*.geode
