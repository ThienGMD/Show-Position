name: Build Geode Mod

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          # Bắt buộc phải có id để hệ thống phân biệt 2 bản khi gộp
          - id: android32
            os: ubuntu-latest
            target: Android32

          - id: android64
            os: ubuntu-latest
            target: Android64

    name: Build ${{ matrix.config.target }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      # Đã sửa thành combine: true để ra lệnh cho Geode SDK chuẩn bị gộp file
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Bước này sẽ tự động thu thập bản 32-bit và 64-bit ở trên để gộp thành 1 file duy nhất
      - name: Combine builds into single file
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      # Upload file Universal duy nhất lên cho bạn tải về
      - name: Upload Final Mod
        uses: actions/upload-artifact@v4
        with:
          name: Show-Position-Mod-Universal-Android
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
