name: Build Geode Mod

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          # Bắt buộc phải có 'id' để Geode SDK nhận diện và upload đúng tên
          - id: android32
            os: ubuntu-latest
            target: Android32

          - id: android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.target }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      # Action này sẽ tự động build và ĐẨY NGẦM file lên server dựa vào 'id' ở trên
      # KHÔNG ĐƯỢC thêm bước actions/upload-artifact thủ công vào đây
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: false
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Action này sẽ TỰ ĐỘNG tìm các file ngầm từ bước build, tải về và gộp thành 1 file duy nhất
      - name: Combine builds into single file
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      # Bước cuối cùng lấy kết quả từ bước combine để cho bạn tải về
      - name: Upload Final Mod
        uses: actions/upload-artifact@v4
        with:
          name: Show-Position-Mod-Android
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
