name: Build Geode Mod

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: false
          target: ${{ matrix.config.target }}

      # Upload file .geode tương ứng với từng phiên bản (Android32 và Android64)
      - name: Upload intermediate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ matrix.config.target }}
          path: |
            out/**/*.geode
            build/**/*.geode
          if-no-files-found: error

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Bước combine sẽ TỰ ĐỘNG tải tất cả các file từ bước upload (có tên bắt đầu bằng "build-output-") và gộp chúng lại.
      # Tuyệt đối không cần gọi actions/download-artifact thủ công ở đây.
      - name: Combine builds into single file
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      # Sau khi gộp xong, step combine sẽ trả về kết quả. Ta dùng output đó để upload bản Mod cuối cùng.
      - name: Upload Final Mod
        uses: actions/upload-artifact@v4
        with:
          name: Show-Position-Mod-Android
          path: ${{ steps.build.outputs.build-output }}
