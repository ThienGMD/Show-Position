name: Build Geode Mod

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: false
          target: ${{ matrix.config.target }}

      # FIX TẠI ĐÂY: Chỉ gom file .geode nằm trong thư mục out hoặc build (nơi chứa mod của bạn), không gom bừa bãi toàn bộ máy ảo nữa
      - name: Upload intermediate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ matrix.config.target }}
          path: |
            out/**/*.geode
            build/**/*.geode
          if-no-files-found: error # Báo đỏ ngay nếu không tìm thấy file mod của bạn

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: build-artifacts
          pattern: build-output-*

      # FIX TẠI ĐÂY: Loại bỏ rác, chỉ cho phép lệnh combine đọc các file mod hợp lệ nằm trong các thư mục build-output-*
      - name: Combine builds into single file
        uses: geode-sdk/build-geode-mod/combine@main
        id: build
        with:
          path: build-artifacts

      - name: Upload Final Mod
        uses: actions/upload-artifact@v4
        with:
          name: Show-Position-Mod
          path: |
            build-artifacts/**/*.geode
            out/**/*.geode
