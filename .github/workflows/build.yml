name: Build Geode Mod

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: false
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Combine builds into single file
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      # FIX TẠI ĐÂY: Dùng dấu **/*.geode để tự động tìm mọi file mod xuất ra ở bất kỳ thư mục nào
      - name: Upload Final Mod
        uses: actions/upload-artifact@v4
        with:
          name: Show-Position-Mod-Android
          path: "**/*.geode"
          if-no-files-found: error # Sẽ báo đỏ nếu thực sự không có file nào được tạo ra
